<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58cc02" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="เรียน เล่น และแข่งหมากรุกไทยได้ทุกที่ — Learn and play Thai chess (Makruk)" />
    <title>หมากรุกไทย · Makruk</title>
    <script>
      // Apply saved colour scheme and language before first paint (avoids a light flash in dark mode).
      try {
        var saved = (JSON.parse(localStorage.getItem('makruk.settings') || '{}').state) || {};
        var scheme = saved.colorScheme || 'system';
        var dark = scheme === 'dark' || (scheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (saved.language) document.documentElement.lang = saved.language;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
