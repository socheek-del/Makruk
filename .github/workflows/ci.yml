name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm 10 crashes resolving this dependency tree; use npm 11.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run verify
      - run: npm run build
